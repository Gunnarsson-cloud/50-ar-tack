<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="50-årsfesten förevigad – varje vin en väninna på flaska.">
<title>50 år – Ett sällskap av väninnor</title>
<style>
  /* ---- Minimal reset + tokens ---- */
  *,*::before,*::after{box-sizing:border-box;margin:0}
  :root{
    --vin:#4a0d20;--vin-ljus:#6b1330;--vin-mork:#37081a;--guld:#c9a24b;--guld-ljus:#e8d29a;
    --papper:#fbf7f0;--bleck:#2a1418;--dammig:#efe6d6;--skugga:0 6px 22px rgba(60,10,25,.10);
    --max:960px;--radie:16px;
    --font:'Georgia','Times New Roman',serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font);color:var(--bleck);background:var(--papper);
    line-height:1.55;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 50% -10%,rgba(201,162,75,.12),transparent 60%);
  }
  /* ---- Förstasida: mörkt vinröd tacktals-sida (mobil-först) ---- */
  header{
    min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;padding:clamp(3rem,10vw,5rem) 1.35rem clamp(3.5rem,10vw,5rem);
    background:
      radial-gradient(130% 90% at 50% 0%,rgba(201,162,75,.16),transparent 55%),
      linear-gradient(165deg,var(--vin-ljus) 0%,var(--vin) 45%,var(--vin-mork) 100%);
    color:var(--guld-ljus);position:relative;overflow:hidden;
  }
  header::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;
    background:linear-gradient(90deg,transparent,var(--guld),transparent)}
  .eyebrow{font-family:var(--sans);font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;
    color:var(--guld);opacity:.85;margin-bottom:.4rem}
  .femtio{font-size:clamp(3.6rem,20vw,7rem);line-height:.85;font-weight:700;
    color:var(--guld-ljus);letter-spacing:-3px;text-shadow:0 3px 14px rgba(0,0,0,.3);
    margin-bottom:clamp(1.4rem,5vw,2rem)}
  /* Tacktalet: kursiv guld, versrader */
  .tacktal{max-width:33rem;margin:0 auto}
  .tacktal p{font-style:italic;color:var(--guld-ljus);
    font-size:clamp(1.05rem,4.4vw,1.35rem);line-height:1.7;
    margin:0 0 clamp(1.1rem,4vw,1.6rem);text-shadow:0 1px 10px rgba(0,0,0,.25)}
  .tacktal-final{margin:clamp(1.4rem,5vw,2rem) auto 0;font-style:italic;
    color:#fff;font-size:clamp(1.2rem,5.2vw,1.6rem);letter-spacing:.04em}
  .tacktal-final::before{content:"";display:block;width:56px;height:1px;margin:0 auto 1.2rem;
    background:linear-gradient(90deg,transparent,var(--guld),transparent)}
  .scrollhint{margin-top:clamp(2rem,7vw,3rem);color:var(--guld-ljus);font-family:var(--sans);
    font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;opacity:.7;
    animation:bob 2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(6px)}}
  @media(prefers-reduced-motion:reduce){.scrollhint{animation:none}}
  /* ---- Vin-intro (ljus) ---- */
  .vin-intro{text-align:center;max-width:var(--max);margin:0 auto;padding:clamp(2.5rem,8vw,4rem) 1.25rem 0}
  .vin-intro h2{font-size:clamp(1.6rem,7vw,2.3rem);color:var(--vin-ljus)}
  .vin-intro .underrubrik{max-width:34rem;margin:.6rem auto 0;font-style:italic;color:#6a4a52;
    font-size:clamp(.95rem,3.6vw,1.1rem)}
  .rakn{margin-top:1.2rem;display:inline-block;font-family:var(--sans);font-size:.76rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--vin-ljus);
    border:1px solid var(--dammig);border-radius:100px;padding:.45rem 1.1rem}
  /* ---- Filter ---- */
  nav.filter{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:.4rem;
    justify-content:center;padding:.75rem 1rem;background:rgba(251,247,240,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--dammig)}
  nav.filter button{font-family:var(--sans);font-size:.82rem;cursor:pointer;
    border:1px solid var(--dammig);background:#fff;color:var(--vin);
    padding:.4rem .85rem;border-radius:100px;transition:.15s}
  nav.filter button[aria-pressed="true"]{background:var(--vin);color:#fff;border-color:var(--vin)}
  /* ---- Grid ---- */
  main{max-width:var(--max);margin:0 auto;padding:1.5rem 1rem 4rem}
  .grid{display:grid;gap:1.1rem;grid-template-columns:1fr}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
  @media(min-width:860px){.grid{grid-template-columns:1fr 1fr 1fr}}
  /* ---- Kort (visitkort) ---- */
  .kort{background:#fff;border-radius:var(--radie);overflow:hidden;box-shadow:var(--skugga);
    border:1px solid var(--dammig);display:flex;flex-direction:column;
    opacity:0;transform:translateY(12px);animation:in .5s forwards}
  @keyframes in{to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.kort{animation:none;opacity:1;transform:none}}
  .kort .bild{aspect-ratio:3/4;background:
    linear-gradient(135deg,var(--dammig),#fff);position:relative;overflow:hidden}
  .kort .bild img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}
  /* Platshållaren visas bara när ingen bild finns (bilden tas bort vid fel) */
  .kort .bild:has(img) .platsh{display:none}
  .kort .bild .platsh{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:.4rem;color:var(--vin);
    font-family:var(--sans);text-align:center;padding:1rem}
  .kort .bild .platsh svg{width:38px;height:38px;opacity:.55}
  .kort .bild .platsh span{font-size:.72rem;letter-spacing:.08em;opacity:.65}
  .typ-tagg{position:absolute;top:.6rem;left:.6rem;font-family:var(--sans);font-size:.66rem;
    letter-spacing:.1em;text-transform:uppercase;color:#fff;padding:.25rem .6rem;
    border-radius:100px;background:var(--vin)}
  .typ-Vitt .typ-tagg{background:#b08d2f}
  .typ-Mousserande .typ-tagg{background:#9a7b1f}
  .typ-Sött .typ-tagg{background:#c98a2b}
  .kort .txt{padding:1rem 1.05rem 1.2rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
  .kort h2{font-size:1.06rem;line-height:1.25;color:var(--vin)}
  .kort .ursprung{font-family:var(--sans);font-size:.74rem;letter-spacing:.05em;
    text-transform:uppercase;color:#9a8a6a}
  .kort p.pers{font-size:.94rem;color:#3a2a2e}
  .kort .nr{margin-top:auto;font-family:var(--sans);font-size:.7rem;color:#c3b79c;
    border-top:1px dashed var(--dammig);padding-top:.6rem}
  /* ---- Gästgalleri ---- */
  .galleri-sektion{background:var(--vin-mork);color:var(--papper);padding:clamp(2.5rem,8vw,4rem) 1rem}
  .galleri-sektion .inner{max-width:var(--max);margin:0 auto}
  .galleri-sektion h2{text-align:center;font-size:clamp(1.6rem,7vw,2.4rem);color:var(--guld-ljus)}
  .galleri-sektion .ingress{text-align:center;max-width:34rem;margin:.6rem auto 1.8rem;
    font-style:italic;opacity:.9;font-size:clamp(.95rem,3.6vw,1.1rem)}
  .galleri{columns:2;column-gap:.5rem}
  @media(min-width:560px){.galleri{columns:3}}
  @media(min-width:860px){.galleri{columns:4}}
  .galleri img{width:100%;height:auto;margin:0 0 .5rem;border-radius:8px;display:block;cursor:zoom-in;
    background:rgba(255,255,255,.05);break-inside:avoid}
  /* Lättviktig lightbox */
  #lb{position:fixed;inset:0;background:rgba(20,4,10,.94);display:none;align-items:center;
    justify-content:center;z-index:50;padding:1rem}
  #lb.pa{display:flex}
  #lb img{max-width:100%;max-height:92vh;border-radius:8px}
  #lb .stang{position:absolute;top:.8rem;right:1.1rem;color:var(--guld-ljus);font-size:2rem;
    cursor:pointer;font-family:var(--sans);line-height:1}
  footer{text-align:center;padding:2.5rem 1.25rem;color:#8a7a62;font-size:.85rem;
    font-family:var(--sans);border-top:1px solid var(--dammig)}
  footer strong{color:var(--vin)}
</style>
</head>
<body>
<header>
  <div class="eyebrow" id="eyebrow">50 år · Tacktal</div>
  <div class="femtio">50</div>
  <div class="tacktal" id="tacktal"></div>
  <div class="tacktal-final" id="tacktalFinal"></div>
  <div class="scrollhint">Bläddra ↓</div>
</header>

<section class="vin-intro">
  <h2>Ett helt sällskap av väninnor</h2>
  <p class="underrubrik" id="underrubrik"></p>
  <div class="rakn" id="rakn">Laddar sällskapet…</div>
</section>

<nav class="filter" id="filter" aria-label="Filtrera efter vintyp"></nav>

<main>
  <div class="grid" id="grid"></div>
</main>

<section class="galleri-sektion" id="galleri">
  <div class="inner">
    <h2>Gästerna</h2>
    <p class="ingress">Ni som gjorde kvällen. Tryck på en bild för att se den större.</p>
    <div class="galleri" id="galleriGrid"></div>
  </div>
</section>

<div id="lb"><span class="stang" aria-label="Stäng">×</span><img alt=""></div>

<footer>
  <p><strong id="antal">36</strong> väninnor, förevigade från festen.<br>
  Alla namn och årgångar är avlästa direkt från flaskornas etiketter — inget är påhittat.</p>
</footer>

<script>
// Liten vanilla-JS: hämtar viner.json, bygger visitkort, filtrerar. Ingen framework.
const glasIkon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 22h8M12 15v7M5 3h14l-1 5a6 6 0 0 1-12 0z"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function kort(v){
  // <picture> förberett för AVIF/WebP + lazy-loading. Faller tillbaka till elegant platshållare.
  const bas = v.bild_path ? v.bild_path.replace(/\.(webp|avif|jpe?g|png)$/i,'') : '';
  const bild = v.bild_path ? `
      <picture>
        <source srcset="${esc(bas)}.avif" type="image/avif">
        <source srcset="${esc(bas)}.webp" type="image/webp">
        <img src="${esc(bas)}.webp" alt="Flaska: ${esc(v.namn)}" loading="lazy" decoding="async"
             width="600" height="800"
             onerror="this.closest('.bild').classList.add('tom');this.remove()">
      </picture>` : '';
  return `<article class="kort typ-${esc(v.typ)}" data-typ="${esc(v.typ)}">
    <div class="bild">
      <span class="typ-tagg">${esc(v.typ)}</span>
      ${bild}
      <div class="platsh">${glasIkon}<span>Foto på väg</span></div>
    </div>
    <div class="txt">
      <div class="ursprung">${esc(v.ursprung||'')}</div>
      <h2>${esc(v.namn)}</h2>
      <p class="pers">${esc(v.personlighet_se)}</p>
      <div class="nr">Nr ${v.id} &nbsp;·&nbsp; ${esc(v.foto_kalla||'')}</div>
    </div>
  </article>`;
}

function bygg(viner, typ){
  const grid = document.getElementById('grid');
  const lista = typ==='Alla' ? viner : viner.filter(v=>v.typ===typ);
  grid.innerHTML = lista.map(kort).join('');
}

fetch('./viner.json').then(r=>r.json()).then(data=>{
  const viner = data.viner;
  document.getElementById('underrubrik').textContent = data.fest.underrubrik;
  if (data.fest.tacktal_eyebrow) document.getElementById('eyebrow').textContent = data.fest.tacktal_eyebrow;
  // Tacktalet: varje strof = <p>, varje versrad avdelas med radbrytning
  if (Array.isArray(data.fest.tacktal)) {
    document.getElementById('tacktal').innerHTML = data.fest.tacktal
      .map(strof => `<p>${strof.map(esc).join('<br>')}</p>`).join('');
  }
  if (data.fest.tacktal_final) document.getElementById('tacktalFinal').textContent = data.fest.tacktal_final;
  document.getElementById('rakn').textContent = `${viner.length} viner · 50 år · en väninna åt gången`;
  document.getElementById('antal').textContent = viner.length;

  // Bygg filterknappar dynamiskt av de typer som faktiskt finns
  const typer = ['Alla', ...[...new Set(viner.map(v=>v.typ))]];
  const nav = document.getElementById('filter');
  nav.innerHTML = typer.map((t,i)=>`<button aria-pressed="${i===0}" data-typ="${t}">${t}</button>`).join('');
  nav.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    nav.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    bygg(viner, b.dataset.typ);
  });

  bygg(viner, 'Alla');
}).catch(err=>{
  document.getElementById('grid').innerHTML =
    '<p style="grid-column:1/-1;text-align:center;color:#8f1d40">Kunde inte läsa viner.json — kör sidan via en webbserver (se README).</p>';
  console.error(err);
});

// ---- Gästgalleri (valfritt): läser galleri.json om den finns ----
fetch('./galleri.json').then(r=>r.ok?r.json():Promise.reject()).then(g=>{
  const grid=document.getElementById('galleriGrid');
  grid.innerHTML = g.bilder.map(b=>
    `<img src="${esc(b.fil)}" alt="Gästbild från festen" loading="lazy" decoding="async"
          width="${b.bredd}" height="${b.hojd}">`).join('');
  // Lightbox
  const lb=document.getElementById('lb'), lbImg=lb.querySelector('img');
  grid.addEventListener('click',e=>{
    const im=e.target.closest('img'); if(!im) return;
    lbImg.src=im.src; lb.classList.add('pa');
  });
  const stang=()=>{lb.classList.remove('pa'); lbImg.src='';};
  lb.addEventListener('click',stang);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')stang();});
}).catch(()=>{ document.getElementById('galleri').style.display='none'; });
</script>
<style>.bild.tom .platsh span{content:""}</style>
</body>
</html>
